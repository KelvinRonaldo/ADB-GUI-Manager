[package]
name = "adb-gui-manager"
version = "0.3.11"
description = "Interface gráfica para o adb"
authors = ["Kelvin Ronaldo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "adb_gui_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "net"] }
portable-pty = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Versão portátil: dados, configurações e o perfil do WebView2 numa pasta ao lado do
# executável (adb-gui-manager-data), nada no perfil do usuário.
portable = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
